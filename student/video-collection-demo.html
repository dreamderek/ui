<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaMath｜影片集</title>
  <style>
    :root{--green:#315c38;--deep:#173d23;--soft:#eef6ea;--bg:#f5f7f2;--line:#e1e8dc;--ink:#203022;--muted:#718071;--blue:#4f798b}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif}button{font:inherit;cursor:pointer}.app{width:100%;height:100vh;min-width:0;display:grid;grid-template-columns:78px minmax(0,1fr);overflow:hidden}
    .sidebar{padding:14px 7px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center}.brand{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;color:#fff;background:linear-gradient(135deg,#5c8e55,#1b4929);box-shadow:0 7px 15px #1b482522;font:700 21px Georgia,serif}.nav{width:100%;display:grid;gap:7px;margin-top:22px}.nav a,.nav button{min-height:56px;padding:6px 2px;border:0;border-radius:11px;color:#687666;background:transparent;text-align:center;text-decoration:none;font-size:10px;font-weight:800}.nav span{display:block;margin-bottom:3px;font-size:17px;line-height:18px}.nav .active{color:var(--green);background:var(--soft);box-shadow:inset 3px 0 #557d47}.help{width:42px;height:42px;margin-top:auto;border:1px solid var(--line);border-radius:13px;color:#50704c;background:#fff;font-weight:800}
    .shell{min-width:0;height:100vh;display:grid;grid-template-rows:68px minmax(0,1fr);overflow:hidden}.topbar{padding:10px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffefa}.eyebrow,.overline{margin:0;color:#53793e;font-size:11px;font-weight:800;letter-spacing:.08em}.topbar h1{margin:2px 0 0;font:700 21px Georgia,"Microsoft JhengHei",serif}.tools{display:flex;align-items:center;gap:10px}.school,.bell{border:1px solid var(--line);border-radius:10px;color:var(--green);background:#f4f7f0;font-size:12px;font-weight:800}.school{padding:8px 12px}.bell{width:35px;height:35px;padding:0;background:#fff}.avatar{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;color:#3f6140;background:#eff1e9;font-size:12px;font-weight:800}
    .workspace{width:min(1510px,100%);height:100%;min-width:0;min-height:0;margin:0 auto;padding:22px 30px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.view-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:16px}.view-head h2{margin:4px 0 0;font:700 28px Georgia,"Microsoft JhengHei",serif}.view-head p:last-child{margin:0;color:var(--muted);font-size:12px}.content{position:relative;height:100%;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:17px}.panel{border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 5px 14px rgba(28,61,33,.035)}
    .detail{min-width:0;min-height:0;padding:21px 23px 23px;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.detail-top{display:flex;align-items:start;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}.title-block{min-width:0}.detail h3{margin:5px 0 0;font:700 24px Georgia,"Microsoft JhengHei",serif}.detail-meta{display:flex;gap:8px;margin-top:10px;color:var(--muted);font-size:11px}.header-tags{display:flex;justify-content:flex-end;align-content:flex-start;flex-wrap:wrap;gap:5px;max-width:42%;padding-top:4px}.tag{display:inline-block;padding:5px 8px;border-radius:7px;color:#3d6981;background:#e9f5f8;font-size:10px;font-weight:800;white-space:nowrap}.tag.green{color:#467045;background:#e9f5e7}.video-body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:18px;overflow:auto}.video-preview{position:relative;min-height:380px;overflow:hidden;border:1px solid #d9e3df;border-radius:14px;background:linear-gradient(135deg,#173d43,#356a76 58%,#8eb4ae);box-shadow:inset 0 0 0 1px #ffffff1c}.video-preview:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,#ffffff09 47px 48px),linear-gradient(135deg,#102e38aa,#154e4c22)}.video-preview:after{content:"Σ";position:absolute;right:8%;bottom:-18%;color:#ffffff16;font:900 260px Georgia}.preview-content{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;padding:29px;color:#fff}.preview-kicker{color:#d0ece8;font-size:12px;font-weight:800;letter-spacing:.08em}.preview-content h4{max-width:520px;margin:9px 0 5px;font:700 31px Georgia,"Microsoft JhengHei",serif}.preview-content p{max-width:500px;margin:0;color:#e1f0ed;font-size:13px;line-height:1.7}.play{position:absolute;z-index:2;left:50%;top:47%;width:70px;height:70px;padding-left:5px;border:0;border-radius:50%;color:#315c38;background:#fff;box-shadow:0 8px 22px #0d2a3066;font-size:27px;transform:translate(-50%,-50%)}.play:hover{transform:translate(-50%,-50%) scale(1.06)}.duration{position:absolute;right:15px;top:15px;z-index:2;padding:5px 8px;border-radius:6px;color:#fff;background:#102d36aa;font-size:11px;font-weight:800}.description{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fbfcfa}.description h4{margin:0 0 8px;color:#315c38;font-size:12px}.description p{margin:0;color:#637263;font-size:12px;line-height:1.75}
    .collection{min-height:0;padding:10px 8px;display:flex;flex-direction:column;align-items:center}.sheet-list{width:100%;display:grid;gap:7px}.item{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;color:#667766;background:#fff;font-size:12px;font-weight:800}.item.active{color:#315c38;border-color:#b8d8b2;background:#eaf6e7}.rail-expand{width:30px;height:30px;margin-bottom:9px;border:1px solid var(--line);border-radius:8px;color:#547055;background:#fff;font-size:15px;font-weight:800}.rail-tail{margin-top:auto;color:var(--muted);font-size:10px;text-align:center;line-height:1.5}.collection.is-expanded{position:absolute;z-index:5;top:0;right:0;bottom:0;width:min(34vw,420px);padding:12px;overflow:auto;align-items:stretch;box-shadow:0 12px 30px #1d412130}.collection.is-expanded .rail-expand{align-self:flex-end}.collection.is-expanded .sheet-list{gap:8px}.collection.is-expanded .item{width:100%;height:auto;min-height:54px;display:grid;grid-template-columns:26px minmax(0,1fr) 16px;gap:8px;align-items:center;padding:8px;text-align:left}.item .number{display:grid;place-items:center}.item .label,.item i{display:none}.collection.is-expanded .item .number{width:26px;height:26px;border-radius:50%;background:#eff5ed;text-align:center}.collection.is-expanded .item.active .number{color:#fff;background:#4f7d49}.collection.is-expanded .item .label,.collection.is-expanded .item i{display:block}.item b{display:block;font-size:11px;line-height:1.4}.item small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.item i{color:#718071;font-style:normal}.collection.is-expanded .rail-tail{display:none}.empty{display:none;padding:28px 10px;color:var(--muted);text-align:center;font-size:12px;line-height:1.6}
    @media(max-width:900px){.app{grid-template-columns:58px minmax(0,1fr)}.sidebar{padding-inline:5px}.brand{width:38px;height:38px;font-size:18px}.nav{margin-top:16px}.nav a,.nav button{min-height:49px;font-size:9px}.topbar{padding-inline:16px}.school{display:none}.workspace{padding:16px}.view-head h2{font-size:24px}.view-head p:last-child{display:none}.detail{padding:16px}.detail h3{font-size:20px}.video-preview{min-height:330px}.preview-content h4{font-size:26px}}@media(max-width:640px){.app{grid-template-columns:0 minmax(0,1fr)}.sidebar{display:none}.topbar{padding-inline:14px}.workspace{padding:12px}.content{grid-template-columns:minmax(0,1fr) 52px}.collection{padding-inline:6px}.detail{padding:13px}.video-preview{min-height:270px}.preview-content{padding:18px}.preview-content h4{font-size:22px}.collection.is-expanded{width:min(86vw,360px)}}
  </style>
</head>
<body>
  <div class="app"><aside class="sidebar" aria-label="主導覽"><div class="brand">M</div><nav class="nav"><a href="student-home-demo.html"><span>⌂</span>首頁</a><a href="assessment-tasks-demo.html"><span>✓</span>評鑑</a><a href="learning-history-demo.html" class="active"><span>◴</span>歷程</a><button type="button"><span>✉</span>訊息</button><button type="button"><span>◉</span>帳號</button></nav><button class="help" type="button">?</button></aside><div class="shell"><header class="topbar"><div><p class="eyebrow">DEREKKNIGHT・個人學習空間</p><h1>MetaMath</h1></div><div class="tools"><button class="school" type="button">光華國中｜八年級</button><button class="bell" type="button">♧</button><div class="avatar">De</div></div></header><main class="workspace"><header class="view-head"><div><p class="eyebrow">VIDEO COLLECTION</p><h2>影片集</h2></div><p>用短影片整理觀念，隨時回到關鍵步驟。</p></header><section class="content"><article class="panel detail"><header class="detail-top"><div class="title-block"><p class="overline" id="videoMeta">數學・等差、等比級數</p><h3 id="videoTitle">等差、等比級數的前 n 項和</h3><div class="detail-meta"><span>影片長度：08:42</span><span>・</span><span>課堂重點整理</span></div></div><div class="header-tags" id="videoTags"><span class="tag">等差級數</span><span class="tag green">等比級數</span></div></header><div class="video-body"><section class="video-preview" aria-label="影片預覽"><span class="duration" id="duration">08:42</span><button class="play" type="button" aria-label="播放影片">▶</button><div class="preview-content"><span class="preview-kicker">METAMATH MINI LESSON</span><h4 id="previewTitle">等差、等比級數的前 n 項和</h4><p id="previewText">用首項、末項與公比，快速選對前 n 項和公式。</p></div></section><section class="description"><h4>影片描述</h4><p id="videoDescription">從等差與等比數列的差異開始，逐步說明兩種前 n 項和公式，以及 r = 1 的特殊情況。</p></section></div></article><aside class="panel collection" aria-label="影片選擇列"><div class="sheet-list" id="videoList"></div><p class="empty" id="empty">這個知識點目前還沒有影片</p><p class="rail-tail">影片<br>選擇</p></aside></section></main></div></div>
  <script>
    const scope=new URLSearchParams(location.search).get('scope')||'knowledge-5';
    const makeVideo=(id,title,meta,duration,tags,text,description)=>({id,title,meta,duration,tags,text,description});
    const videos={
      'knowledge-1':[makeVideo('sqrt-intro','平方根的基本觀念','數學・平方根概念','06:18',['平方根','基本概念'],'從平方運算回推平方根的意義。','說明正數、0 的平方根，以及平方與平方根互逆的基礎概念。')],
      'knowledge-2':[makeVideo('radical-simplify','根式化簡的拆解方法','數學・根式化簡','07:25',['根式化簡','因數分解'],'把根號內的數拆成完全平方因數。','以多組例題練習找出完全平方因數，完成根式化簡。')],
      'knowledge-3':[makeVideo('number-line','數線中點怎麼找','數學・數線與座標','04:52',['數線','中點'],'透過平均值理解數線上的中點。','用數線圖示與座標計算，掌握兩點中點公式。')],
      'knowledge-4':[makeVideo('exponent-law','指數律的乘除規則','數學・指數律','05:37',['指數律','乘除'],'用同底數冪理解指數的加減。','整理同底數冪相乘、相除與零次方的常見錯誤。')],
      'knowledge-5':[makeVideo('series-sum','等差、等比級數的前 n 項和','數學・等差、等比級數','08:42',['等差級數','等比級數'],'用首項、末項與公比，快速選對前 n 項和公式。','從等差與等比數列的差異開始，逐步說明兩種前 n 項和公式，以及 r = 1 的特殊情況。'),makeVideo('sum-formulas','三個常用求和公式','數學・常用求和公式','05:16',['求和公式','立方和'],'一次整理自然數、平方和與立方和。','利用公式結構與簡短例題，快速辨識可直接套用的級數。')]
    };
    const unique=groups=>[...new Map(groups.flat().map(v=>[v.id,v])).values()];
    const byScope={...videos,'unit-1':unique([videos['knowledge-1'],videos['knowledge-2'],videos['knowledge-3']]),'unit-2':videos['knowledge-4'],'unit-3':videos['knowledge-5'],'book-1':unique(Object.values(videos))};
    const list=document.getElementById('videoList'),rail=document.querySelector('.collection'),items=byScope[scope]||[];
    list.innerHTML=items.map((item,index)=>`<button class="item ${index===0?'active':''}" type="button" data-index="${index}"><span class="number">${index+1}</span><span class="label"><b>${item.title}</b><small>${item.meta}・${item.duration}</small></span><i>›</i></button>`).join('');document.getElementById('empty').style.display=items.length?'none':'block';
    const expand=document.createElement('button');expand.type='button';expand.className='rail-expand';expand.textContent='☰';expand.setAttribute('aria-label','展開影片選擇');rail.prepend(expand);expand.onclick=()=>{const open=rail.classList.toggle('is-expanded');expand.setAttribute('aria-label',open?'收合影片選擇':'展開影片選擇')};
    function render(index){const item=items[index];if(!item)return;document.getElementById('videoMeta').textContent=item.meta;document.getElementById('videoTitle').textContent=item.title;document.getElementById('previewTitle').textContent=item.title;document.getElementById('previewText').textContent=item.text;document.getElementById('videoDescription').textContent=item.description;document.getElementById('duration').textContent=item.duration;document.querySelector('.detail-meta').innerHTML=`<span>影片長度：${item.duration}</span><span>・</span><span>課堂重點整理</span>`;document.getElementById('videoTags').innerHTML=item.tags.map((tag,i)=>`<span class="tag ${i?'green':''}">${tag}</span>`).join('')}
    list.querySelectorAll('.item').forEach(button=>button.onclick=()=>{list.querySelectorAll('.item').forEach(item=>item.classList.toggle('active',item===button));render(Number(button.dataset.index));rail.classList.remove('is-expanded')});render(0);
    document.querySelector('.play').onclick=event=>{event.currentTarget.textContent='Ⅱ';event.currentTarget.setAttribute('aria-label','暫停影片')};
  </script>
</body>
</html>
