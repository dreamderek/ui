<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaMath｜訊息中心</title>
  <style>
    :root{--green:#315c38;--deep:#173d23;--soft:#eef6ea;--page:#f5f7f2;--line:#dfe7da;--ink:#203022;--muted:#718071;--orange:#c96745;--shadow:0 8px 24px rgba(28,61,33,.06)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:var(--page);color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif}button{font:inherit;cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:78px minmax(0,1fr);overflow:hidden}
    .sidebar{z-index:2;padding:14px 7px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center}.brand{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;color:#fff;background:linear-gradient(135deg,#5c8e55,#1b4929);box-shadow:0 7px 15px #1b482522;font:700 21px Georgia,serif}.nav{width:100%;display:grid;gap:7px;margin-top:22px}.nav a{min-height:56px;padding:6px 2px;border-radius:11px;color:#687666;text-align:center;text-decoration:none;font-size:10px;font-weight:800}.nav .icon{display:block;margin-bottom:3px;font-size:17px;line-height:18px}.nav .active{color:var(--green);background:var(--soft);box-shadow:inset 3px 0 #557d47}.help{width:42px;height:42px;margin-top:auto;border:1px solid var(--line);border-radius:13px;color:#50704c;background:#fff;font-weight:800}
    .shell{min-width:0;display:grid;grid-template-rows:68px minmax(0,1fr);overflow:hidden}.topbar{height:68px;padding:10px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffefa}.eyebrow{margin:0;color:#53793e;font-size:11px;font-weight:800;letter-spacing:.08em}.topbar h1{margin:2px 0 0;font:700 21px Georgia,"Microsoft JhengHei",serif}.tools{display:flex;align-items:center;gap:10px}.school,.bell{border:1px solid var(--line);border-radius:10px;color:var(--green);background:#f4f7f0;font-size:12px;font-weight:800}.school{padding:8px 12px}.bell{width:35px;height:35px;padding:0;background:#fff}.avatar{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;color:#3f6140;background:#eff1e9;font-size:12px;font-weight:800}
    .workspace{width:min(1510px,100%);height:100%;min-height:0;margin:0 auto;padding:22px 30px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;overflow:hidden}.heading{display:flex;align-items:end;justify-content:space-between}.heading h2{margin:4px 0 0;font:700 28px Georgia,"Microsoft JhengHei",serif}.heading p:last-child{margin:0;color:var(--muted);font-size:12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 10px 0;padding:4px;border:1px solid #cfe0ca;border-radius:10px;background:#edf5e9;box-shadow:inset 0 1px 0 #ffffffaa}.tab{min-height:32px;border:1px solid transparent;border-radius:7px;color:#527450;background:transparent;font-size:11px;font-weight:800;transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}.tab:hover{border-color:#d4e3cf;background:#f9fcf8}.tab.active{border-color:#315c38;color:#fff;background:var(--green);box-shadow:0 2px 5px #315c3826}.tab .badge,.tab.active .badge{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:2px;border-radius:50%;color:#fff;background:#c96745;font-size:9px}
    .message-layout{display:grid;grid-template-columns:minmax(290px,.72fr) minmax(0,1.4fr);gap:17px;min-height:0}.panel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:var(--shadow)}.inbox{display:flex;flex-direction:column;overflow:hidden}.inbox-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 20px 12px;border-bottom:1px solid var(--line);background:#fff}.inbox-header p{margin:0;color:#53793e;font-size:12px;font-weight:800}.inbox-header b{margin-left:auto;font-size:14px}.collapse-all{width:27px;height:27px;display:grid;place-items:center;padding:0;border:1px solid #cfe0ca;border-radius:7px;color:#547451;background:#fff;font-size:15px;font-weight:800}.collapse-all:hover{border-color:#9db998;background:#edf5e9}.message-list{flex:1;min-height:0;padding:10px;overflow:auto;overscroll-behavior:contain}.source-group{margin-bottom:10px;border:1px solid var(--line);border-radius:11px;background:#fbfcfa;overflow:hidden}.source-trigger{width:100%;display:flex;align-items:center;gap:9px;padding:11px 12px;border:0;color:#365e3b;background:#f4f8f1;text-align:left;font-size:12px;font-weight:800}.source-trigger:hover{background:#edf5e9}.source-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#4d7a49;font-size:10px}.source-trigger.system .source-icon{background:#6a8791}.source-total{margin-left:auto;color:#718071;font-size:10px}.chevron{margin-left:3px;color:#6a8068;font-size:14px;transition:transform .2s}.source-messages{max-height:1000px;padding:8px;overflow:hidden;opacity:1;transition:max-height .28s ease,opacity .18s ease,padding .28s ease}.source-group.is-collapsed .source-messages{max-height:0;padding-top:0;padding-bottom:0;opacity:0}.source-group.is-collapsed .chevron{transform:rotate(-90deg)}.message-card{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr);gap:11px;align-items:center;margin-bottom:7px;padding:12px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff;text-align:left}.message-card:last-child{margin-bottom:0}.message-card:hover{background:#f5f9f2}.message-card.active{border-color:#416d3c;background:#f8fbf6;box-shadow:inset 3px 0 #416d3c}.dot{width:10px;height:10px;border-radius:50%;background:#4f994b}.message-card.read .dot{background:#c5d0c1}.message-card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.message-card small{display:block;margin-top:5px;overflow:hidden;color:var(--muted);text-overflow:ellipsis;white-space:nowrap;font-size:10px}.message-card .meta{margin-top:4px;color:#889487;font-size:10px}.empty-list{padding:30px 10px;color:var(--muted);text-align:center;font-size:12px}
    .detail{display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.detail-header{padding:20px 21px 15px;border-bottom:1px solid var(--line)}.labels{display:flex;gap:6px;margin-left:auto}.label{padding:5px 9px;border-radius:99px;color:#527a4d;background:#eaf5e7;font-size:10px;font-weight:800;white-space:nowrap}.label.unread{color:#9b542f;background:#fff0e8}.label.assessment{color:#92651e;background:#fff0d9}.label.message{color:#4a7180;background:#eaf4f7}.detail-sender{display:flex;align-items:center;gap:11px;margin-top:15px}.sender-avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#396b3b;font-weight:800}.detail-sender b{font-size:14px}.detail-sender span{color:var(--muted);font-size:11px}.detail-header h3{margin:18px 0 0;font:700 27px Georgia,"Microsoft JhengHei",serif}.detail-body{min-height:0;padding:18px 21px;overflow:auto;overscroll-behavior:contain}.time-box{margin-bottom:15px;padding:15px;border-radius:13px;background:#f7f8f3;font-size:13px}.detail-body p{margin:0 0 14px;font-size:14px;line-height:1.8}.assessment-link{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border-radius:9px;color:#fff;background:var(--green);box-shadow:0 5px 12px #315c3820;text-decoration:none;font-size:12px;font-weight:800}.assessment-link:hover{filter:brightness(1.08)}.outline-btn,.primary-btn{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#587057;font-weight:800;font-size:12px;white-space:nowrap}.actions{display:flex;gap:8px;padding:14px 21px;border-top:1px solid var(--line)}.primary-btn{border-color:var(--green);color:#fff;background:var(--green)}.disabled{opacity:.58;cursor:not-allowed}
    @media(max-width:900px){.app{grid-template-columns:58px minmax(0,1fr)}.sidebar{padding-inline:5px}.brand{width:38px;height:38px;font-size:18px}.nav{margin-top:16px}.nav a{min-height:49px;font-size:9px}.topbar{padding-inline:16px}.school{display:none}.workspace{padding:16px}.heading h2{font-size:24px}.heading p:last-child{display:none}.message-layout{grid-template-columns:minmax(245px,.8fr) minmax(0,1.2fr)}.detail-header h3{font-size:22px}}@media(max-width:640px){.app{grid-template-columns:0 minmax(0,1fr)}.sidebar{display:none}.topbar{padding-inline:14px}.workspace{padding:12px;gap:12px}.heading{align-items:center}.tabs{gap:2px}.message-layout{grid-template-columns:1fr}.inbox{display:none}.detail-header h3{font-size:21px}.quick-card,.notice-box{grid-template-columns:36px minmax(0,1fr)}.quick-card button,.notice-box button{grid-column:2}.actions{padding-inline:15px}}
  </style>
</head>
<body>
  <div class="app"><aside class="sidebar" aria-label="主導覽"><div class="brand">M</div><nav class="nav"><a href="student-home-demo.html"><span class="icon">⌂</span>首頁</a><a href="assessment-tasks-demo.html"><span class="icon">✓</span>評鑑</a><a href="learning-history-demo.html"><span class="icon">◴</span>歷程</a><a class="active" href="messages-demo.html" aria-current="page"><span class="icon">✉</span>訊息</a><a href="#"><span class="icon">♙</span>帳號</a></nav><button class="help" type="button" aria-label="說明">?</button></aside><div class="shell"><header class="topbar"><div><p class="eyebrow">DEREKKNIGHT・數學學習空間</p><h1>MetaMath</h1></div><div class="tools"><button class="school" type="button">⌂　光華國中・八年級⌄</button><button class="bell" type="button" aria-label="通知">♧</button><div class="avatar">De</div></div></header><main class="workspace"><header class="heading"><div><p class="eyebrow">MESSAGES</p><h2>訊息</h2></div><p>集中查看老師通知、任務提醒與學習回覆。</p></header><nav class="tabs" aria-label="訊息篩選"><button class="tab active" data-filter="all" type="button">全部</button><button class="tab" data-filter="unread" type="button">未讀 <span class="badge">2</span></button><button class="tab" data-filter="read" type="button">已讀</button></nav><section class="message-layout"><aside class="panel inbox" aria-label="訊息清單"><header class="inbox-header"><p>訊息來源</p><b id="count">共 5 則</b></header><div class="message-list" id="messageList"></div></aside><article class="panel detail"><header class="detail-header"><div class="labels"><span class="label">老師</span><span class="label notice">其他通知</span><span class="label">已讀</span></div><div class="detail-sender"><div class="sender-avatar">邱</div><div><b>邱OO</b><span>・站內訊息 ・2025/07/25 00:00</span></div></div><h3 id="detailTitle">0725_2</h3></header><div class="detail-body" id="detailBody"></div><footer class="actions"><button class="primary-btn" type="button">標記已讀</button><button class="outline-btn disabled" type="button" disabled>稍後提醒</button><button class="primary-btn" type="button">刪除</button><button class="outline-btn disabled" type="button" disabled>回覆</button></footer></article></section></main></div></div>
  <script>
    document.querySelector('.inbox').prepend(document.querySelector('.tabs'));
    document.querySelector('.inbox-header').insertAdjacentHTML('beforeend','<button class="collapse-all" id="collapseAll" type="button" aria-label="全收合" title="全收合">⊟</button>');
    document.querySelector('.detail-sender').append(document.querySelector('.labels'));
    const messages=[{source:'teacher',type:'assessment',title:'0725_2',preview:'新評鑑已開放：請於期限內完成作答。',date:'2025/07/25 00:00',read:true,body:'評鑑時間：2025/07/25 00:00:00~2025/07/26 00:00:00',href:'assessment-tasks-demo.html'},{source:'teacher',type:'assessment',title:'0725',preview:'老師已完成批改，請查看評鑑回饋。',date:'2025/07/25 00:00',read:false,body:'本次評鑑已完成批改，你可以查看作答結果與老師提供的建議。',href:'assessment-review-demo.html'},{source:'teacher',type:'message',title:'看排版',preview:'老師已新增一則學習建議。',date:'2025/06/29 00:00',read:true,body:'老師已整理本週的學習建議，建議你先複習等差數列的基本概念。'},{source:'system',type:'assessment',title:'高二機率',preview:'申覆結果已更新，請查看評鑑處理結果。',date:'2025/06/29 00:00',read:false,body:'你的評鑑申覆已有最新結果，請前往該次評鑑查看完整說明。',href:'assessment-review-demo.html'},{source:'system',type:'message',title:'王宣測試',preview:'系統通知測試訊息。',date:'2025/06/20 10:30',read:true,body:'這是一則系統通知測試訊息。'}];
    const list=document.getElementById('messageList'),count=document.getElementById('count'),title=document.getElementById('detailTitle'),body=document.getElementById('detailBody'),collapseAll=document.getElementById('collapseAll'),labels=document.querySelector('.labels');let filter='all',activeIndex=0;const collapsedSources=new Set();const sourceInfo={teacher:{label:'發送老師',icon:'師'},system:{label:'系統',icon:'系'}};
    const detailMarkup=message=>`<div class="time-box">${message.body}</div><p>${message.type==='assessment'?'此通知直接關聯到一項評鑑，你可以從下方按鈕前往查看作答、批改或申覆結果。':'這則訊息已送達你的訊息中心，請依照內容安排後續學習。'}</p>${message.type==='assessment'?`<a class="assessment-link" href="${message.href}">前往對應評鑑 <span>↗</span></a>`:''}`;
    function cardMarkup(m){return `<button class="message-card ${m.read?'read':''} ${m.index===activeIndex?'active':''}" data-index="${m.index}" type="button"><span class="dot"></span><span><b>${m.title}</b><small>${m.preview}</small><span class="meta">${m.source==='teacher'?'邱OO':'系統'} ・ ${m.date} ・ ${m.read?'已讀':'未讀'}</span></span></button>`}
    function render(){const visible=messages.map((m,index)=>({...m,index})).filter(m=>filter==='all'||(filter==='unread'?!m.read:m.read));count.textContent=`共 ${visible.length} 則`;if(!visible.some(m=>m.index===activeIndex))activeIndex=visible[0]?.index??0;list.innerHTML=visible.length?['teacher','system'].map(source=>{const group=visible.filter(m=>m.source===source);if(!group.length)return '';const info=sourceInfo[source],collapsed=collapsedSources.has(source);return `<section class="source-group ${collapsed?'is-collapsed':''}"><button class="source-trigger ${source}" data-source="${source}" type="button" aria-expanded="${!collapsed}"><span class="source-icon">${info.icon}</span>${info.label}<span class="source-total">${group.length} 則</span><span class="chevron">⌄</span></button><div class="source-messages">${group.map(cardMarkup).join('')}</div></section>`}).join(''):'<p class="empty-list">這個分類暫時沒有訊息</p>';const selectedMessage=messages[activeIndex];if(selectedMessage){title.textContent=selectedMessage.title;body.innerHTML=detailMarkup(selectedMessage);labels.innerHTML=`<span class="label ${selectedMessage.read?'':'unread'}">${selectedMessage.read?'已讀':'未讀'}</span><span class="label ${selectedMessage.type==='assessment'?'assessment':'message'}">${selectedMessage.type==='assessment'?'評鑑通知':'訊息'}</span>`}list.querySelectorAll('.message-card').forEach(card=>card.addEventListener('click',()=>{activeIndex=Number(card.dataset.index);messages[activeIndex].read=true;render()}));list.querySelectorAll('.source-trigger').forEach(trigger=>trigger.addEventListener('click',()=>{const source=trigger.dataset.source;collapsedSources.has(source)?collapsedSources.delete(source):collapsedSources.add(source);render()}));const expanded=collapsedSources.size!==2;collapseAll.textContent=expanded?'⊟':'⊞';collapseAll.setAttribute('aria-label',expanded?'全收合':'全部展開');collapseAll.title=collapseAll.getAttribute('aria-label');}
    collapseAll.addEventListener('click',()=>{if(collapsedSources.size===2)collapsedSources.clear();else{collapsedSources.add('teacher');collapsedSources.add('system')}render()});document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{filter=tab.dataset.filter;document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));render()}));render();
  </script>
</body>
</html>
